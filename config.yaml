# ============================================================
# Aerial Defense Decision-Support System — Configuration
# ============================================================
# All tunable parameters live here. Change values freely;
# the code reads this file at startup, so edits take effect
# on the next run without touching any Python code.
# ============================================================

# --- Data file paths (relative to project root) ---
data:
  threats_file: "data/threats.xlsx"
  countermeasures_file: "data/countermeasures.xlsx"

# --- Stage 1: Threat Priority Score (TPS) weights ---
# Must sum to 1.0
tps_weights:
  speed: 0.25
  detectability: 0.20       # inverse of altitude — low-alt = harder to detect
  payload: 0.15
  detection_range: 0.15     # inverse — short detection range = more dangerous
  rf_link: 0.10             # no RF link (autonomous) = harder to counter
  threat_class: 0.15        # severity tier lookup

# --- Threat class → severity mapping (1–10 scale) ---
threat_class_severity:
  # Tier 10 — Strategic / hypersonic / near-impossible to intercept
  "Hypersonic Glide": 10
  "Hypersonic Cruise": 10
  "Bomber": 10
  # Tier 9 — High-end manned / hypersonic anti-ship
  "Hypersonic Anti-Ship": 9
  "Fighter Aircraft": 9
  # Tier 8 — Cruise missiles (various)
  "Cruise Missile": 8
  "Anti-Ship Cruise": 8
  "Air-to-Surface Cruise": 8
  "Submarine Cruise": 8
  "Cruise Missile (aerial target/decoy)": 8
  "Cruise Missile (air-launched target)": 8
  "Cruise Missile (legacy target drone)": 8
  "Cruise Missile (aerial target)": 8
  # Tier 7 — Anti-ship / air-to-air / SAMs
  "Anti-Ship Missile": 7
  "Anti-Ship/Radiation": 7
  "Air-to-Air Missile": 7
  "Surface-to-Air Missile": 7
  "Man-Portable SAM": 7
  "Air-to-Surface Missile": 7
  # Tier 6 — UCAV / combat drones / guided weapons
  "UCAV": 6
  "Combat UAV": 6
  "Combat Multirotor": 6
  "Loitering Munition": 6
  "Guided Bomb/Missile": 6
  "Guided Bomb": 6
  "Guided Shell": 6
  "Glide Bomb": 6
  "Cluster Bomb": 6
  # Tier 5 — Medium UAVs / rockets
  "MALE UAV": 5
  "HALE UAV": 5
  "Rocket": 5
  "ATGM": 5
  # Tier 4 — Surveillance / helicopters
  "Surveillance UAV": 4
  "Helicopter": 4
  "Helicopter (rotary-wing UAV)": 4
  # Tier 3 — Tactical / swarm
  "Target Drone": 3
  "Swarm Drone": 3
  "FPV Drone": 3
  # Tier 2 — Small commercial
  "Small Commercial UAV": 2
  "Small Commercial UAV (logistics/cargo)": 2
  "Aerostat": 2
  # Tier 1 — Micro
  "Surveillance UAV (MAV)": 1
  # Tier 5 — Torpedo (kept for completeness, filtered out of aerial)
  "ASW Torpedo": 5
  # Default for unmapped classes
  default_severity: 5

# --- Stage 2.2: Synthetic base_kill_probability weights ---
# Used to derive Pk when no real column exists.
# IMPORTANT: Range is NOT included here — it is handled by range_fit_factor.
#            Including it here would double-count range coverage.
# Weights MUST sum to 1.0:  0.40 + 0.35 + 0.25 = 1.00
synthetic_pk_weights:
  weapon_class_tier: 0.40    # class-based effectiveness tier (dominant factor)
  speed_ratio: 0.35          # cm.max_speed / threat.max_speed
  altitude_ratio: 0.25       # cm.max_altitude / threat.max_altitude

