# --- Stage 3: Decision Engine parameters ---
decision_engine:
  SMALL_GAP: 5        # percentage points — gap <= 5 → cost wins
  LARGE_GAP: 15       # percentage points — gap > 15 → Pk wins outright
  CRITICAL_PK: 70     # percentage — below this, Pk wins (ignore cost) for single selection
  COMBO_TRIGGER_PK: 60  # percentage — below this, also search multi-weapon combinations
  TARGET_PK: 85       # percentage — target P_combined for combination mode
  alpha: 0.70         # Pk weight in weighted-score band
  beta: 0.30          # cost weight in weighted-score band
  max_combo_size: 3   # max weapons in a combo

# --- CM classes to EXCLUDE (non-engagement items) ---
excluded_cm_classes_patterns:
  - "Radar"
  - "Detection Sensor"
  - "EO System"
  - "Airborne Early Warning"
  - "Ballistic Missile"
  - "SLBM"
  - "Guided Rocket"
  - "Precision-Guided"
  - "Anti-Radiation"
  - "Air-to-Surface"
  - "Hypersonic"
  - "Cruise Missile"
  - "Air-to-Air Missile"
